<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
}

.carved-button {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    border-radius: 22px;
    cursor: pointer;

    /* Completely transparent so it inherits the exact screen background color */
    background: transparent;

    -webkit-tap-highlight-color: transparent;

    /* Dark inner shadow (top-left) + Subtle light reflection (bottom-right) */
    box-shadow:
        inset 5px 5px 10px rgba(0, 0, 0, 0.60),
        inset -3px -3px 8px rgba(255, 255, 255, 0.12);

    transition:
        transform 0.12s ease,
        box-shadow 0.12s ease;
}

/* Prevent anything from showing outside the rounded shape */
body {
    clip-path: inset(0 round 22px);
}

/* Pressed State */
.carved-button:active {
    transform: scale(0.985);

    /* Deeper inner shadow when tapped */
    box-shadow:
        inset 7px 7px 14px rgba(0, 0, 0, 0.75),
        inset -2px -2px 5px rgba(255, 255, 255, 0.08);
}

.carved-button:focus {
    outline: none;
}
</style>
</head>

<body>

<button
    class="button carved-button"
    aria-label="Button"
    onclick="buttonPressed()">
</button>

<script>
function buttonPressed() {
    // Your action here
}
</script>

</body>
</html>
