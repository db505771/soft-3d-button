<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Carved Liquid Groove</title>
  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      overflow: hidden;
    }

    .carved-liquid-groove {
      width: 100%;
      height: 100%;
      box-sizing: border-box;

      appearance: none;
      -webkit-appearance: none;
      outline: none;
      padding: 0;
      margin: 0;
      display: block;
      cursor: pointer;

      /* Smooth rounded corners */
      border-radius: 22px;
      overflow: hidden;

      /* CLIPPING FIX: Forces the WebKit engine to cleanly composite parent pixels under the blur */
      -webkit-mask-image: -webkit-radial-gradient(white, black);

      /* Direct background tint using dark overlay gradient for cavity depth */
      background: linear-gradient(
        135deg,
        rgba(0, 0, 0, 0.35) 0%,
        rgba(0, 0, 0, 0.15) 100%
      );

      /* Native Backdrop Blur + Saturation boost to make underlying app colors pop inside the groove */
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);

      border: none;

      /* CARVED INSET SHADOWS: Dark top-left cavity shadow + subtle light bottom-right rim reflection */
      box-shadow: 
        inset 4px 4px 10px rgba(0, 0, 0, 0.65),
        inset 1px 1px 2px rgba(0, 0, 0, 0.80),
        inset -3px -3px 8px rgba(255, 255, 255, 0.15),
        inset -1px -1px 2px rgba(255, 255, 255, 0.25);

      /* Touch Feedback */
      transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .carved-liquid-groove:active {
      transform: scale(0.985);

      /* Sinks deeper on press */
      background: linear-gradient(
        135deg,
        rgba(0, 0, 0, 0.45) 0%,
        rgba(0, 0, 0, 0.25) 100%
      );

      box-shadow: 
        inset 6px 6px 14px rgba(0, 0, 0, 0.75),
        inset 2px 2px 4px rgba(0, 0, 0, 0.90),
        inset -2px -2px 6px rgba(255, 255, 255, 0.10);
    }
  </style>
</head>
<body>

  <button class="carved-liquid-groove" type="button" onclick="buttonPressed()"></button>

  <script>
    function buttonPressed() {
      // Your Adalo action trigger goes here
    }
  </script>
</body>
</html>
