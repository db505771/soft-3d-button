<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
}

.carved-button {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    border-radius: 22px;
    cursor: pointer;

    /* Semi-transparent tint that blends directly with the app background */
    background: rgba(0, 0, 0, 0.18);

    -webkit-tap-highlight-color: transparent;

    /* Carved / Sunken 3D Effect (Inset Shadows) */
    box-shadow:
        inset 4px 4px 8px rgba(0, 0, 0, 0.55),
        inset -4px -4px 8px rgba(255, 255, 255, 0.08);

    transition:
        transform 0.12s ease,
        background 0.12s ease,
        box-shadow 0.12s ease;
}

/* Prevent anything from showing outside the rounded shape */
body {
    clip-path: inset(0 round 22px);
}

/* Pressed State */
.carved-button:active {
    background: rgba(0, 0, 0, 0.28);
    transform: scale(0.985);

    /* Slightly deeper inset shadow on press */
    box-shadow:
        inset 6px 6px 12px rgba(0, 0, 0, 0.65),
        inset -3px -3px 6px rgba(255, 255, 255, 0.05);
}

.carved-button:focus {
    outline: none;
}
</style>
</head>

<body>

<button
    class="carved-button"
    aria-label="Button"
    onclick="buttonPressed()">
</button>

<script>
function buttonPressed() {
    // Your action here
}
</script>

</body>
</html>
