<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<style>
:root {
    /* Set this to your app background color */
    --theme-bg: #064e3b; 
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
}

.carved-button {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    border-radius: 22px;
    cursor: pointer;

    /* 100% Solid Color Base - Fully Opaque */
    background-color: var(--theme-bg);

    /* Applies a solid surface blur without making it see-through */
    filter: url('#solid-blur');
    -webkit-filter: url('#solid-blur');

    -webkit-tap-highlight-color: transparent;

    /* Inset Carved Shadows built from the solid background */
    box-shadow:
        inset 6px 6px 12px color-mix(in srgb, var(--theme-bg) 30%, #000000),
        inset -4px -4px 8px color-mix(in srgb, var(--theme-bg) 75%, #ffffff);

    transition:
        transform 0.12s ease,
        box-shadow 0.12s ease;
}

body {
    clip-path: inset(0 round 22px);
}

/* Pressed State */
.carved-button:active {
    transform: scale(0.985);

    box-shadow:
        inset 8px 8px 16px color-mix(in srgb, var(--theme-bg) 20%, #000000),
        inset -3px -3px 6px color-mix(in srgb, var(--theme-bg) 85%, #ffffff);
}

.carved-button:focus {
    outline: none;
}
</style>
</head>

<body>

<!-- Hidden SVG filter that creates a solid surface blur -->
<svg style="display:none;">
  <defs>
    <filter id="solid-blur">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>
</svg>

<button
    class="carved-button"
    aria-label="Button"
    onclick="buttonPressed()">
</button>

<script>
function buttonPressed() {
    // Your action here
}
</script>

</body>
</html>
