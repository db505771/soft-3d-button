<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    overflow: hidden;
    background: transparent;
}

.button {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    border: none;
    outline: none;

    border-radius: 22px;

    background: rgba(43, 29, 72, 0.58);

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        inset 0 -1px 0 rgba(0,0,0,0.10),
        7px 7px 16px rgba(18,10,34,0.35),
        -7px -7px 16px rgba(91,67,128,0.20);

    transition:
        transform 0.12s ease,
        background 0.12s ease,
        box-shadow 0.12s ease;
}

.button:active {
    background: rgba(43, 29, 72, 0.66);

    transform: scale(0.985);

    box-shadow:
        inset 5px 5px 10px rgba(18,10,34,0.35),
        inset -5px -5px 10px rgba(91,67,128,0.16);
}

.button:focus {
    outline: none;
}
</style>
</head>

<body>

<button
    class="button"
    aria-label="Button"
    onclick="buttonPressed()">
</button>

<script>
function buttonPressed() {
    // Your Adalo action can go here.
}
</script>

</body>
</html>
