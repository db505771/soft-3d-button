<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
}

.carved-button {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    border-radius: 22px;
    cursor: pointer;

    /* Subtle backdrop blur combined with color brightness adjustment */
    backdrop-filter: blur(8px) brightness(0.82) contrast(1.1);
    -webkit-backdrop-filter: blur(8px) brightness(0.82) contrast(1.1);
    
    /* Fallback base tint */
    background: rgba(0, 0, 0, 0.12);

    -webkit-tap-highlight-color: transparent;

    /* Crisp Carved Inset Edge Shadows */
    box-shadow:
        inset 4px 4px 10px rgba(0, 0, 0, 0.65),
        inset 1px 1px 2px rgba(0, 0, 0, 0.80),
        inset -3px -3px 8px rgba(255, 255, 255, 0.12),
        inset -1px -1px 2px rgba(255, 255, 255, 0.20);

    transition:
        transform 0.12s ease,
        backdrop-filter 0.12s ease,
        box-shadow 0.12s ease;
}

/* Prevent anything from showing outside the rounded shape */
body {
    clip-path: inset(0 round 22px);
}

/* Pressed State */
.carved-button:active {
    backdrop-filter: blur(10px) brightness(0.75) contrast(1.15);
    -webkit-backdrop-filter: blur(10px) brightness(0.75) contrast(1.15);
    transform: scale(0.985);

    /* Deeper shadow on press */
    box-shadow:
        inset 6px 6px 14px rgba(0, 0, 0, 0.75),
        inset 2px 2px 4px rgba(0, 0, 0, 0.90),
        inset -2px -2px 6px rgba(255, 255, 255, 0.08);
}

.carved-button:focus {
    outline: none;
}
</style>
</head>

<body>

<button
    class="carved-button"
    aria-label="Button"
    onclick="buttonPressed()">
</button>

<script>
function buttonPressed() {
    // Your action here
}
</script>

</body>
</html>
