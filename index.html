<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
}

.carved-button {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    border-radius: 22px;
    cursor: pointer;

    /* No background color — uses blur to catch the underlying theme color */
    background: transparent;
    
    /* Blurs whatever is directly behind the button */
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    -webkit-tap-highlight-color: transparent;

    /* Inset shadows to create the carved depth effect */
    box-shadow:
        inset 5px 5px 12px rgba(0, 0, 0, 0.65),
        inset -3px -3px 8px rgba(255, 255, 255, 0.15);

    transition:
        transform 0.12s ease,
        backdrop-filter 0.12s ease,
        box-shadow 0.12s ease;
}

/* Keeps corners clean */
body {
    clip-path: inset(0 round 22px);
}

/* Pressed State */
.carved-button:active {
    transform: scale(0.985);
    
    /* Slightly stronger blur and deeper cavity when pressed */
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow:
        inset 7px 7px 15px rgba(0, 0, 0, 0.80),
        inset -2px -2px 5px rgba(255, 255, 255, 0.10);
}

.carved-button:focus {
    outline: none;
}
</style>
</head>

<body>

<button
    class="carved-button"
    aria-label="Button"
    onclick="buttonPressed()">
</button>

<script>
function buttonPressed() {
    // Your action here
}
</script>

</body>
</html>
