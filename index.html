<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Reset margins and ensure html/body fill the viewport */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* FULLSCREEN SOFT 3D BUTTON SKIN */
        .soft-3d-button {
            width: 100%;
            height: 100%;
            border-radius: 0;
            border: none;
            cursor: pointer;
            outline: none;
            
            /* Dynamically blends with whatever background color surrounds it */
            background-color: inherit;
            box-shadow: 
                6px 6px 12px color-mix(in srgb, currentColor 50%, #000000),
                -6px -6px 12px color-mix(in srgb, currentColor 70%, #ffffff);
            
            transition: all 0.15s ease;
        }

        /* Pressed State */
        .soft-3d-button:active {
            box-shadow: 
                inset 5px 5px 10px color-mix(in srgb, currentColor 50%, #000000),
                inset -5px -5px 10px color-mix(in srgb, currentColor 70%, #ffffff);
            transform: scale(0.99);
        }
    </style>
</head>
<body>

    <button class="soft-3d-button"></button>

</body>
</html>
