<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
}

/* Entire Web View is the button */
.button {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    border: 0;
    outline: 0;

    background: rgba(43, 29, 72, 0.58);

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

    /*
       Soft 3D depth.
       The shadows make the translucent surface
       appear much more solid than it actually is.
    */
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        inset 0 -1px 0 rgba(0,0,0,0.10),
        7px 7px 16px rgba(18,10,34,0.35),
        -7px -7px 16px rgba(91,67,128,0.20);

    transition:
        transform 0.12s ease,
        background 0.12s ease,
        box-shadow 0.12s ease;
}

/* Pressed */
.button:active {
    background: rgba(43, 29, 72, 0.66);

    transform: scale(0.985);

    box-shadow:
        inset 5px 5px 10px rgba(18,10,34,0.35),
        inset -5px -5px 10px rgba(91,67,128,0.16);
}

/* Removes the ugly blue focus outline on iOS */
.button:focus {
    outline: none;
}
</style>
</head>

<body>

<button
    class="button"
    aria-label="Button"
    onclick="buttonPressed()">
</button>

<script>
function buttonPressed() {

    /*
       Your Adalo/Web View action goes here.
    */

}
</script>

</body>
</html>
