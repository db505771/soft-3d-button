<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<style>
:root {
    /* Fallback theme color */
    --bg-color: #2b1d48; 
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
}

.carved-button {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    border-radius: 22px;
    cursor: pointer;

    /* Completely solid background derived from the theme color */
    background-color: var(--bg-color);

    -webkit-tap-highlight-color: transparent;

    /* 
       Carved depth created entirely by blending highlights and shadows 
       into the base color (no transparency or blur required)
    */
    box-shadow:
        inset 5px 5px 10px color-mix(in srgb, var(--bg-color) 40%, #000000),
        inset -4px -4px 8px color-mix(in srgb, var(--bg-color) 70%, #ffffff);

    transition:
        transform 0.12s ease,
        background-color 0.15s ease,
        box-shadow 0.12s ease;
}

body {
    clip-path: inset(0 round 22px);
}

/* Pressed State */
.carved-button:active {
    transform: scale(0.985);

    box-shadow:
        inset 7px 7px 14px color-mix(in srgb, var(--bg-color) 25%, #000000),
        inset -3px -3px 6px color-mix(in srgb, var(--bg-color) 85%, #ffffff);
}

.carved-button:focus {
    outline: none;
}
</style>
</head>

<body>

<button
    class="carved-button"
    aria-label="Button"
    onclick="buttonPressed()">
</button>

<script>
// Automatically checks the URL query parameters for a color hex passed from Adalo
// Example usage in Adalo component URL/HTML: component.html?color=2b1d48
const urlParams = new URLSearchParams(window.location.search);
const themeColor = urlParams.get('color');

if (themeColor) {
    document.documentElement.style.setProperty('--bg-color', '#' + themeColor.replace('#', ''));
}

function buttonPressed() {
    // Your action here
}
</script>

</body>
</html>
